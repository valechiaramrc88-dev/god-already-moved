<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>God Already Moved — the companion web app</title>
  <meta name="description" content="One faithful action. Every day. Starting now. The companion web app to the 12-week devotional God Already Moved by Mia Luce.">
  <meta name="theme-color" content="#f7ece1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#today" aria-label="God Already Moved, home">
      <span class="brand-god">GOD</span><span class="brand-script">Already Moved</span>
    </a>
    <button class="night-btn" id="nightBtn" type="button">Hard night?</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <a href="#today" data-tab="today">Today</a>
    <a href="#path" data-tab="path">My Path</a>
    <a href="#toolkit" data-tab="toolkit">Toolkit</a>
  </nav>

  <div class="modal" id="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <button class="close" id="modalClose" type="button" aria-label="Close">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="printArea"></div>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
